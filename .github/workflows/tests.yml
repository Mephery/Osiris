name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Tests backend (Python)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./osiris_test.db
          JWT_SECRET: osiris-test-secret-not-for-production
          FERNET_KEY: o0iGmcXE-Q8vzulvt4mQHHuCAIy0JyZwD8bmskK5J5I=
          REDIS_URL: redis://localhost:6379
          OSIRIS_BASE_URL: http://localhost:8000
          OSIRIS_IP: "127.0.0.1"
          ADMIN_EMAIL: admin@osiris.test
          ADMIN_PASSWORD: testadminpass
        run: python -m pytest --tb=short

  typecheck:
    name: Verification types frontend (tsc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances npm
        working-directory: frontend
        run: npm ci

      - name: Verifier les types TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
