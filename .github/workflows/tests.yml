name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Tests backend (Python)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Le gros de la suite tourne sur SQLite, mais les migrations sont du
      # Postgres pur (SERIAL, ADD COLUMN IF NOT EXISTS, NOW()) : sans une vraie
      # base ici, tests/test_migrations.py se contente de se sauter, et une
      # installation neuve peut rester cassee sans que personne ne le voie.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osiris
          POSTGRES_PASSWORD: osiris
          POSTGRES_DB: osiris_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./osiris_test.db
          JWT_SECRET: osiris-test-secret-not-for-production
          FERNET_KEY: o0iGmcXE-Q8vzulvt4mQHHuCAIy0JyZwD8bmskK5J5I=
          REDIS_URL: redis://localhost:6379
          OSIRIS_BASE_URL: http://localhost:8000
          OSIRIS_IP: "127.0.0.1"
          ADMIN_EMAIL: admin@osiris.test
          ADMIN_PASSWORD: testadminpass
          OSIRIS_MIGRATION_TEST_DB: postgresql://osiris:osiris@localhost/osiris_migrations_test
        run: python -m pytest --tb=short

  frontend:
    name: Verification frontend (tsc + eslint + vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances npm
        working-directory: frontend
        run: npm ci

      - name: Verifier les types TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      # --max-warnings 0 : le depot est a zero avertissement depuis le nettoyage
      # du 19/08 (any, deps manquantes, setState synchrone dans un effet). Sans
      # ce seuil, un nouvel avertissement s'accumule en silence au lieu de faire
      # echouer la CI, et le fichier revient lentement a son etat d'avant.
      - name: Verifier le lint ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings 0

      - name: Lancer les tests unitaires
        working-directory: frontend
        run: npm test
