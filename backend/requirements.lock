# Versions EXACTES avec lesquelles OSIRIS tourne et passe ses tests.
#
#   pip install -r requirements.lock        <- installation (production comme dev)
#
# requirements.txt dit ce dont OSIRIS a besoin ; ce fichier dit dans quelle
# version. Sans lui, une installation récupère les dernières versions du jour :
# le 28/10/2026, une installation neuve tirait SQLAlchemy 2.1, dont le pilote
# PostgreSQL par défaut n'est plus celui installé, et les migrations échouaient.
#
# Mettre à jour une dépendance : la changer dans un environnement de test, faire
# passer toute la suite, puis régénérer ce fichier (voir README, « Dépendances »).
